<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a12" />
    <title>Offline · NecrotixLab</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: Inter, Segoe UI, system-ui, sans-serif;
        background: #0c0a12;
        color: #f4f1ea;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.65rem; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.03em; }
      p { color: rgba(244, 241, 234, 0.55); line-height: 1.55; margin: 0 0 22px; font-size: 0.95rem; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #f4f1ea;
        color: #0c0a12;
        padding: 10px 18px;
        font: 600 13px/1 Inter, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>NecrotixLab will reload when the connection returns. The installed app keeps this fallback page so you are never looking at a blank tab.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
